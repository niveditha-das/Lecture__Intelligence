name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Fast: no database, no models, ~30s. This is the job that earns its keep
  # day to day — it catches import-time errors and provenance regressions,
  # neither of which a syntax check will find.
  # ---------------------------------------------------------------------
  tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install test deps only
        run: pip install pytest numpy

      - name: provenance, metrics, mastery and alignment
        run: cd backend && python -m pytest tests -q

  # ---------------------------------------------------------------------
  # Import check: the whole app must load. A dataclass with a defaulted field
  # in the wrong position, a missing router, a bad import — none of these are
  # syntax errors, and all of them take the API down at startup.
  # ---------------------------------------------------------------------
  imports:
    name: app imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install runtime deps (CPU torch, no CUDA wheels)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      - name: import every module
        run: |
          cd backend
          python - <<'PY'
          import importlib, pkgutil, sys
          import app
          failed = []
          for m in pkgutil.walk_packages(app.__path__, "app."):
              try:
                  importlib.import_module(m.name)
              except Exception as exc:
                  failed.append((m.name, f"{type(exc).__name__}: {exc}"))
          for name, err in failed:
              print(f"FAIL {name}: {err}")
          sys.exit(1 if failed else 0)
          PY

  # ---------------------------------------------------------------------
  # Retrieval gate: ingest the committed sample PDFs, load the hand-verified
  # gold set, and fail if recall or MRR drop below a floor.
  #
  # Honest scope: the fixture corpus is small (~43 chunks), so recall is
  # near-saturated and this catches breakage rather than subtle regression.
  # It is still the difference between "the chunker change looked fine" and
  # "the chunker change silently stopped matching anything".
  # ---------------------------------------------------------------------
  retrieval-gate:
    name: retrieval quality gate
    runs-on: ubuntu-latest
    needs: [tests, imports]
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lia
          POSTGRES_PASSWORD: lia
          POSTGRES_DB: lia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lia" --health-interval 5s
          --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://lia:lia@localhost:5432/lia
      PGPASSWORD: lia
      EMBEDDING_PROVIDER: local
      RERANK_ENABLED: "true"
      RERANK_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      STORAGE_DIR: /tmp/storage
      GIT_SHA: ${{ github.sha }}
      HF_HOME: ~/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The embedding model is 2.2GB. Downloading it on every run would make
      # this job unusable, so it's cached on the model name.
      - name: cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-minilm-v1

      - name: install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt

      - name: apply schema
        run: |
          psql "$DATABASE_URL" -f backend/migrations/001_init.sql
          psql "$DATABASE_URL" -f backend/migrations/002_written_questions.sql

      - name: seed fixture corpus and gold set
        run: cd backend && python -m app.evaluation.seed --samples ../samples

      - name: start api
        run: |
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf localhost:8000/health && break
            sleep 4
          done
          curl -sf localhost:8000/health || (echo "api never came up"; tail -60 /tmp/api.log; exit 1)

      # Retrieval only: no API key needed, no cost, deterministic.
      - name: gate
        run: |
          cd backend
          python -m app.evaluation.runner \
            --label "ci ${GITHUB_SHA::7}" \
            --retrieval-only \
            --fail-under recall_at_k=0.80 \
            --fail-under mrr=0.70

      - name: api log on failure
        if: failure()
        run: tail -80 /tmp/api.log
