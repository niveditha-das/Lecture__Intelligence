services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lia
      POSTGRES_PASSWORD: lia
      POSTGRES_DB: lia
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lia"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://lia:lia@db:5432/lia
      STORAGE_DIR: /data/storage
      GIT_SHA: ${GIT_SHA:-}
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - storage:/data/storage
      - hfcache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
volumes:
  pgdata:
  storage:
  hfcache:
